[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gliznet"
version = "0.1.0"
description = "GliZNet is a generalist and lightweight model for zero-shot sequence classification, inspired by GLiNER. It achieves efficient classification by encoding both text and labels in a single forward pass."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "dotenv>=0.9.9",
    "huggingface-hub>=1.8.0",
    "llm-output-parser>=0.3.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "nlpaug>=1.1.11",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "sentencepiece>=0.2.1",
    "torch>=2.6.0",
    "transformers>=5.4.0",
    "wandb>=0.25.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:importlib",
]

[tool.setuptools.packages.find]
include = ["gliznet*"]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "tox>=4.53.0",
    "tox-uv>=1.0.0",
]
evaluate = [
    "gliclass>=0.1.14",
    "gradio>=6.14.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "peft>=0.19.1",
]
