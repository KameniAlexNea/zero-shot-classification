# Text augmentation pipeline for GliZNet training.
# Each entry: {name, prob (probability of applying), params}
#
# Available text augmentations:
#   SuffixTruncation  - "running" -> "runnin" (informal spelling, custom)
#   RandomCaseChange  - lowercases capitalized words (custom)
#   KeyboardTypo      - QWERTY adjacent key replacement (nlpaug KeyboardAug)
#   OcrTypo           - OCR-like character substitution (nlpaug OcrAug)
#   CharSwap          - swap adjacent characters (nlpaug RandomCharAug swap)
#   CharDrop          - delete a character (nlpaug RandomCharAug delete)
#   CharInsert        - insert a random character (nlpaug RandomCharAug insert)
#   WordDrop          - delete random words (nlpaug RandomWordAug delete)
#   WordSwap          - swap adjacent words (nlpaug RandomWordAug swap)
#   SpellingError     - common spelling mistakes (nlpaug SpellingAug)
#   WordSplit         - split a word into two (nlpaug SplitAug)
#
# Available label augmentations:
#   RatioEnforcement         - enforce a target pos/neg ratio
#   RatioEnforcementSelector  - randomly pick neg-heavy, pos-heavy, or pass-through
#   LabelLimit               - limits total labels & shuffles

augmentations:
  - name: SuffixTruncation
    prob: 0.3
    params:
      word_prob: 0.12

  - name: KeyboardTypo
    prob: 0.3
    params:
      word_prob: 0.08

  - name: OcrTypo
    prob: 0.2
    params:
      word_prob: 0.06

  - name: SpellingError
    prob: 0.2
    params:
      word_prob: 0.08

  - name: CharSwap
    prob: 0.2
    params:
      word_prob: 0.08

  - name: CharDrop
    prob: 0.15
    params:
      word_prob: 0.06

  - name: WordDrop
    prob: 0.15
    params:
      word_prob: 0.04

  - name: RandomCaseChange
    prob: 0.1
    params:
      word_prob: 0.05

# Label augmentations are applied sequentially to (labels_text, labels_int)
label_augmentations:
  - name: RatioEnforcementSelector
    params:
      neg_prob: 0.5
      pos_prob: 0.2
      neg_params:
        min_positives: 1
        max_positives: 3
        min_negatives: 3
        max_negatives: 10
      pos_params:
        min_positives: 2
        max_positives: 6
        min_negatives: 0
        max_negatives: 2

  - name: LabelLimit
    params:
      max_labels: 20
      shuffle_labels: true
      remove_underscores: 0.9
