# Text augmentation pipeline for GliZNet training.
# Each entry: {name, prob (probability of applying), params}
#
# Available text augmentations:
#   SuffixTruncation  - "running" -> "runnin" (informal spelling, custom)
#   RandomCaseChange  - lowercases capitalized words (custom)
#   KeyboardTypo      - QWERTY adjacent key replacement (nlpaug KeyboardAug)
#   OcrTypo           - OCR-like character substitution (nlpaug OcrAug)
#   RandomChar        - character-level aug (nlpaug RandomCharAug, action: swap/delete/insert)
#   RandomWord        - word-level aug (nlpaug RandomWordAug, action: delete/swap)
#   SpellingError     - common spelling mistakes (nlpaug SpellingAug)
#   WordSplit         - split a word into two (nlpaug SplitAug)
#
# Available label augmentations:
#   RatioEnforcement         - enforce a target pos/neg ratio
#   RatioEnforcementSelector  - randomly pick neg-heavy, pos-heavy, or pass-through
#   LabelLimit               - limits total labels & shuffles

augmentations:
  - name: SuffixTruncation
    prob: 0.1
    params:
      word_prob: 0.12

  - name: KeyboardTypo
    prob: 0.15
    params:
      aug_word_p: 0.08
      aug_char_min: 1
      aug_char_max: 1
      min_char: 4

  - name: OcrTypo
    prob: 0.1
    params:
      aug_word_p: 0.06
      aug_char_min: 1
      aug_char_max: 1
      min_char: 4

  - name: SpellingError
    prob: 0.1
    params:
      aug_p: 0.08
      aug_min: 1

  - name: RandomChar
    prob: 0.1
    params:
      action: swap
      aug_word_p: 0.08
      aug_char_min: 1
      aug_char_max: 1
      min_char: 4

  - name: RandomChar
    prob: 0.15
    params:
      action: delete
      aug_word_p: 0.06
      aug_char_min: 1
      aug_char_max: 1
      min_char: 4

  - name: RandomWord
    prob: 0.1
    params:
      action: delete
      aug_p: 0.04
      aug_min: 1

  - name: RandomCaseChange
    prob: 0.15
    params:
      word_prob: 0.05

  - name: PunctuationRemoval
    prob: 0.6
    params:
      punct_prob: 0.8
      keep_apostrophe: true

# Label augmentations are applied sequentially to (labels_text, labels_int)
#
# ScenarioAwareSampler targets real-world inference patterns:
#   - needle (20%):   1 positive among many negatives (standard single-label ZSC)
#   - few_pos (15%):  pick n_neg (min 4), then n_pos in [0, n_neg].
#                     Negatives dominate. Includes all-neg (n_pos=0) naturally.
#   - few_neg (10%):  pick n_pos (min 4), then n_neg in [0, n_pos].
#                     Positives dominate. Includes all-pos (n_neg=0) naturally.
#   - balanced (10%): ~50/50 positive/negative
#   - passthrough (45%): keep the original distribution
#
# LabelLimit with preserve_ratio=true uses stratified sampling so the
# upstream ratio isn't destroyed by random truncation.
label_augmentations:
  - name: ScenarioAwareSampler
    params:
      needle_prob: 0.20
      few_pos_prob: 0.40
      few_neg_prob: 0.10
      balanced_prob: 0.15
      # needle: exactly 1 positive, 4-15 negatives
      needle_min_neg: 4
      needle_max_neg: 15
      # few_pos: pick n_neg first (4-15), then n_pos in [0, n_neg]
      few_pos_min_neg: 4
      few_pos_max_neg: 15
      # few_neg: pick n_pos first (4-15), then n_neg in [0, n_pos]
      few_neg_min_pos: 4
      few_neg_max_pos: 15
      # balanced: 3-10 of each class
      balanced_min_per_class: 3
      balanced_max_per_class: 10

  - name: LabelTokenMask
    params:
      prob: 0.15
      token_mask_prob: 0.3
      mask_token: "[MASK]"

  - name: LabelLimit
    params:
      max_labels: 20
      min_labels: 5
      shuffle_labels: true
      remove_underscores: 0.9
      preserve_ratio: true
