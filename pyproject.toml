[project]
name = "zero-shot-classification"
version = "0.1.0"
description = "GliZNet is a generalist and lightweight model for zero-shot sequence classification, inspired by GLiNER. It achieves efficient classification by encoding both text and labels in a single forward pass."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "faker>=40.12.0",
    "huggingface-hub>=1.8.0",
    "llm-output-parser>=0.3.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "sentencepiece>=0.2.1",
    "torch>=2.6.0",
    "transformers>=5.4.0",
    "wandb>=0.25.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
