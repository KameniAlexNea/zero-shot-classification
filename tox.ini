[tox]
envlist = format, test
requires = tox-uv
runner = uv-venv-lock-runner

[testenv:format]
description = Format and lint code with ruff
skip_install = true
dependency_groups = dev
deps = ruff
commands =
    ruff format gliznet tests train_gliznet.py pretrain_gliznet.py
    ruff check --fix gliznet tests train_gliznet.py pretrain_gliznet.py

[testenv:test]
description = Run all tests with coverage
dependency_groups = dev
deps =
    pytest-cov
commands =
    pytest tests/ --ignore=tests/integration --cov=gliznet --cov-report=xml --cov-report=term